name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phpspec:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["7.4", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
